<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zombie Survival 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* HUD */
        #hud {
            position: absolute; bottom: 20px; left: 20px;
            color: white; display: none;
            font-family: 'Arial Black', Arial, sans-serif;
            text-transform: uppercase;
        }
        .stat-box {
            font-size: 18px; margin-bottom: 8px;
            padding: 8px 15px;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.3) 80%, transparent 100%);
            border-left: 3px solid #ff4444;
            letter-spacing: 2px;
        }
        .stat-box span {
            color: #ff6666;
            font-weight: bold;
        }
        #stage-val { color: #66ff66; }
        #hp-val { color: #ff6666; }
        #ammo-val { color: #6666ff; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            display: none;
        }
        #crosshair .line {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
        }
        #crosshair .line.top { width: 2px; height: 12px; left: 50%; top: -20px; transform: translateX(-50%); }
        #crosshair .line.bottom { width: 2px; height: 12px; left: 50%; bottom: -20px; transform: translateX(-50%); }
        #crosshair .line.left { height: 2px; width: 12px; top: 50%; left: -20px; transform: translateY(-50%); }
        #crosshair .line.right { height: 2px; width: 12px; top: 50%; right: -20px; transform: translateY(-50%); }
        #center-dot {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: rgba(255, 50, 50, 0.9); border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 4px rgba(255, 0, 0, 0.5);
        }

        /* Screens */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a0000 0%, #000000 50%, #001a00 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; pointer-events: auto;
        }
        #start-screen h1 {
            font-family: 'Arial Black', Arial, sans-serif;
            font-size: 48px;
            color: #ff3333;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5), 2px 2px 4px black;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }
        #start-screen p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        #class-selection {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }
        .class-btn {
            padding: 15px 25px; margin: 8px; font-size: 16px; cursor: pointer;
            background: linear-gradient(180deg, #333 0%, #1a1a1a 100%);
            color: white; border: 2px solid #444; border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Arial Black', Arial, sans-serif;
            transition: all 0.2s ease;
            min-width: 140px;
        }
        .class-btn:hover {
            background: linear-gradient(180deg, #555 0%, #333 100%);
            border-color: #ff4444;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
            transform: scale(1.05);
        }

        /* Item Guide */
        #item-guide {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #444;
            border-radius: 8px;
            max-width: 700px;
        }
        #item-guide h3 {
            color: #ff6666;
            margin: 0 0 15px 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .guide-items {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .guide-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 5px;
            min-width: 150px;
        }
        .item-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }
        .item-icon.health { background: #00ff00; color: #000; }
        .item-icon.speed { background: #00ffff; color: #000; }
        .item-icon.damage { background: #ff0000; color: #fff; }
        .item-icon.shield { background: #0066ff; color: #fff; }
        .item-icon.nuke { background: #ffff00; color: #000; }
        .item-name {
            font-size: 12px;
            color: #ccc;
        }
        .item-effect {
            font-size: 10px;
            color: #888;
        }

        /* Controls Guide */
        #controls-guide {
            margin-top: 15px;
            font-size: 11px;
            color: #666;
            text-align: center;
        }
        #controls-guide span {
            margin: 0 10px;
        }
        #controls-guide kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            color: #aaa;
        }

        #mobile-controls {
            display: none; /* Enabled via JS if touch detected */
            pointer-events: auto;
        }
        .joystick-zone {
            position: absolute; bottom: 50px; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%;
        }
        #left-stick { left: 50px; }
        #right-stick { right: 50px; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div id="crosshair">
                <div class="line top"></div>
                <div class="line bottom"></div>
                <div class="line left"></div>
                <div class="line right"></div>
                <div id="center-dot"></div>
            </div>
            <div id="hud">
                <div class="stat-box">Stage: <span id="stage-val">1</span></div>
                <div class="stat-box">HP: <span id="hp-val">100</span></div>
                <div class="stat-box">Ammo: <span id="ammo-val">∞</span></div>
            </div>
            <div id="start-screen">
                <h1>ZOMBIE SURVIVAL LOOP</h1>
                <p>Select your character</p>
                <div id="class-selection">
                    <!-- Buttons injected by JS -->
                </div>

                <!-- Item Guide -->
                <div id="item-guide">
                    <h3>📦 Power-Up Items</h3>
                    <div class="guide-items">
                        <div class="guide-item">
                            <div class="item-icon health">+</div>
                            <div>
                                <div class="item-name">Health Pack</div>
                                <div class="item-effect">+50 HP 회복</div>
                            </div>
                        </div>
                        <div class="guide-item">
                            <div class="item-icon speed">⚡</div>
                            <div>
                                <div class="item-name">Speed Boost</div>
                                <div class="item-effect">이동속도 +50% (10초)</div>
                            </div>
                        </div>
                        <div class="guide-item">
                            <div class="item-icon damage">⚔</div>
                            <div>
                                <div class="item-name">Damage Boost</div>
                                <div class="item-effect">공격력 x2 (10초)</div>
                            </div>
                        </div>
                        <div class="guide-item">
                            <div class="item-icon shield">🛡</div>
                            <div>
                                <div class="item-name">Shield</div>
                                <div class="item-effect">받는 피해 -50% (8초)</div>
                            </div>
                        </div>
                        <div class="guide-item">
                            <div class="item-icon nuke">☢</div>
                            <div>
                                <div class="item-name">Nuke</div>
                                <div class="item-effect">모든 좀비 즉사 (희귀)</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Controls Guide -->
                <div id="controls-guide">
                    <span><kbd>WASD</kbd> 이동</span>
                    <span><kbd>Mouse</kbd> 조준</span>
                    <span><kbd>Left Click</kbd> 공격 (꾹 누르면 차지)</span>
                    <span><kbd>Right Click</kbd> 필살기 (10히트 충전)</span>
                </div>
            </div>
            <div id="mobile-controls">
                <div id="left-stick" class="joystick-zone"></div>
                <div id="right-stick" class="joystick-zone"></div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
